; Teensy 4.1 body controller: CAN master for all nodes, BMI270 IMU, e-stop
; loop, watchdog, 1 kHz loop, setpoint interpolation to 200 Hz. The reflex /
; attitude / envelope *logic* is the no_std Rust crate os/blur (supervisor.rs,
; attitude.rs, session.rs); this image is the hardware shell that will call
; into it over a C ABI. Pinned.
[env:teensy41]
platform = teensy@5.0.0
board = teensy41
framework = arduino
build_flags =
    -I ../node_core
    -std=gnu++17
    -O2
lib_deps =
    https://github.com/tonton81/FlexCAN_T4.git
build_src_filter = +<*> +<../../node_core/node_core.c>
