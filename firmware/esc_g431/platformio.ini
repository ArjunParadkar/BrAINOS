; B-G431B-ESC1 node (2806.5 leg joints). Pinned. Not yet built on this
; laptop (no PlatformIO installed); see firmware/README.md.
;
; One node per board, one 2806.5 joint. FOC current loop >= 20 kHz +
; impedance via SimpleFOC; classic CAN 1 Mbit on FDCAN; MT6701 ABZ on the
; encoder header. Flash ALL 12 boards before snapping the ST-LINK strip.
[env:bg431b_esc1]
platform = ststm32@^19.0.0
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -I ../node_core
    -std=gnu++17
    -O2
    -D HAL_FDCAN_MODULE_ENABLED
    -D SIMPLEFOC_STM32_FDCAN
lib_deps =
    askuric/Simple FOC@2.3.4
build_src_filter = +<*> +<../../node_core/node_core.c>
