; ESP32-S3 node (several SimpleFOC Minis for the 4015s / 2204s, DRV8833 for
; the N20). Pinned. Not yet built on this laptop (no PlatformIO); see
; firmware/README.md. TWAI classic CAN 1 Mbit. One node_core per slot:
;   node 17 FRONT (6 slots), node 18 MID/spine (3), node 19 REAR (5).
[env:esp32s3_node]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../node_core
    -std=gnu++17
    -O2
    -D BLUR_NODE_ID=17
lib_deps =
    askuric/Simple FOC@2.3.2
build_src_filter = +<*> +<../../node_core/node_core.c>
