# /etc/brainos/operator.toml — operator runtime configuration.
# Written by the body build; the operator agent owns the schema. Values here are
# the defaults the body guarantees exist so the binary starts even standalone.

[paths]
brain          = "/brain"                 # p1 journal (EPI_A/B, NOTE_A/B, key pub)
home           = "/home/human"
scratch        = "/home/human/.brainos/scratch"
models         = "/opt/brainos/models"
voices         = "/opt/brainos/voices"

[socket]
# operator <-> face IPC (newline-delimited JSON). Under XDG_RUNTIME_DIR.
path           = "brainos/operator.sock"

[llama]
# fast tier — local model server started by brainos-llama.service
url            = "http://127.0.0.1:8080"
health         = "http://127.0.0.1:8080/health"
model          = "/opt/brainos/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
timeout_ms     = 6000

[voice]
# ears: whisper.cpp; mouth: piper. Both live in the body (never a host daemon).
whisper_bin        = "/usr/bin/whisper-cli"
whisper_model      = "/opt/brainos/models/ggml-base.en.bin"
whisper_threads    = 4
piper_bin          = "/opt/brainos/piper/piper"
piper_voice        = "/opt/brainos/voices/en_US-lessac-medium.onnx"
record_seconds     = 5      # default for the voice.listen hand
max_record_seconds = 30     # a push-to-talk never released stops here
speak_replies      = true   # voice in -> voice out

[deliberate]
# Fable API — main model. Key comes from p3 (ANTHROPIC.KEY), never from disk here.
model          = "claude-fable-5"
fallbacks      = "default"
base_url       = "https://api.anthropic.com"


# ---------------------------------------------------------------------------
# Stage 4 — the entity (docs/STAGE4_ENTITY.md). These sections are the ones the
# Rust operator actually reads (serde schema in body/operator/src/config.rs).

[reach]
# other devices offer their hands here (reach/brainos-reach.py). The signature
# over a fresh nonce is the authority; the network is the human's.
listen      = "0.0.0.0:7777"
beacon_port = 7778          # answers `BRAINOS?` so a device can find the seat
seat_name   = "seat"

[tiers]
reflex_budget_ms          = 5      # informational: the speed contract
deliberate_first_token_ms = 1200
speculate      = true              # start the deliberate request in parallel with the fast tier
fast_budget_ms = 600               # after this the held deliberate stream is released

[[pool.models]]
role = "fast"
kind = "llama"
url = "http://127.0.0.1:8080"
[[pool.models]]
role = "deliberate"
kind = "anthropic"
model = "claude-fable-5"
[[pool.models]]
role = "deliberate"
kind = "anthropic"
model = "claude-opus-5"
[[pool.models]]
role = "vision"
kind = "anthropic"
model = "claude-fable-5"