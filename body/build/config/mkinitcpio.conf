# BrAInOS body initramfs. Universal (no autodetect) so ONE UKI boots any machine:
# the block+filesystems hooks bundle every storage/controller and fs driver, and
# MODULES pins the USB/NVMe/virtio paths explicitly. The `kms` hook is deliberately
# omitted: it would pull ~145 MB of nvidia/amdgpu GPU firmware into the UKI for no
# boot benefit (no plymouth; the compositor brings the GPU up from the rootfs
# firmware a fraction of a second after pivot). This keeps the UKI small and fast.
MODULES=(virtio_pci virtio_blk virtio_scsi virtio_gpu vfat ext4 usb_storage uas xhci_hcd xhci_pci ehci_hcd ehci_pci nvme nvme_core ahci sd_mod usbhid hid_generic)
BINARIES=()
FILES=()
HOOKS=(base systemd modconf keyboard sd-vconsole block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
