# BrAInOS body — Hyprland session. Installed at /etc/brainos/session/hyprland.conf.
# The entity is an overlay; the desktop underneath is a normal fast Wayland desktop.

monitor = , preferred, auto, 1

env = XCURSOR_SIZE, 24
env = BRAINOS_SOCK, $XDG_RUNTIME_DIR/brainos/operator.sock

# ── the entity ──
exec-once = swaybg -i /etc/brainos/session/wallpaper.png -m fill
# each organ keeps its own log under the runtime dir (Hyprland would otherwise drop them)
exec-once = /opt/brainos/bin/brainos-operator >> $XDG_RUNTIME_DIR/brainos/operator.log 2>&1
exec-once = /opt/brainos/face/brainos-face >> $XDG_RUNTIME_DIR/brainos/face.log 2>&1
# Chromium is the operator's web hand (CDP); headless, no window.
exec-once = chromium --headless=new --remote-debugging-port=9222 --remote-allow-origins=* --no-first-run --disable-gpu --user-data-dir=$XDG_RUNTIME_DIR/brainos/chromium about:blank
exec-once = wl-paste --watch cliphist store

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ff4fa3ee) rgba(7a1d4fee) 45deg
    col.inactive_border = rgba(2a1620aa)
    layout = dwindle
    allow_tearing = false
}
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
}
animations {
    enabled = true
    bezier = ease, 0.2, 0.9, 0.2, 1.0
    animation = windows, 1, 3, ease, popin 90%
    animation = layers, 1, 3, ease, fade
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, ease, slide
}
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    repeat_rate = 40
    repeat_delay = 250
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
dwindle {
    preserve_split = true
}

# the face's layers: no blur behind the teach overlay (it must show the real screen)
layerrule = blur on, match:namespace ^(brainos-face)$
layerrule = ignore_alpha 0.05, match:namespace ^(brainos-face)$
layerrule = blur on, match:namespace ^(brainos-surface.*)$
layerrule = ignore_alpha 0.05, match:namespace ^(brainos-surface.*)$
layerrule = no_anim on, match:namespace ^(brainos-teach)$

$mod = SUPER

# SUPER+SPACE: tap = focus the entity's command line; hold >250 ms = push-to-talk
bind  = $mod, SPACE, exec, /opt/brainos/face/brainos-face --key-down
bindr = $mod, SPACE, exec, /opt/brainos/face/brainos-face --key-up
bind  = $mod, ESCAPE, exec, /opt/brainos/face/brainos-face --cancel

bind = $mod, RETURN, exec, foot
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating
bind = $mod SHIFT, L, exec, hyprlock
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim - | wl-copy
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
