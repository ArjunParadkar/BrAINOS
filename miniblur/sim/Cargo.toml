[package]
name = "miniblur-sim"
version = "0.1.0"
edition = "2021"
description = "A simulated Mini-Blur that speaks the Reach wire protocol — the Phase 0 test rig"

[[bin]]
name = "miniblur-sim"
path = "src/main.rs"

[dependencies]
miniblur-core = { path = "../core" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_json = "1"
